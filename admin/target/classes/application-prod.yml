# 生产环境配置
spring:
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    password: ${REDIS_PASSWORD}
    database: ${REDIS_DATABASE:8}

mypet:
  db:
    host: ${DB_HOST}
    port: ${DB_PORT}
    user: ${DB_USER}
    password: ${DB_PASSWORD}
  upload:
    path: ${UPLOAD_PATH}
  base-url: ${BASE_URL}

logging:
  level:
    app.xinqianmao.com: WARN
    root: WARN
