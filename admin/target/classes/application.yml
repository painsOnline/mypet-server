server:
  port: 8081

spring:
  application:
    name: mypet-admin
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

jwt:
  secret: mypet-jwt-secret-key-2026-minimum-32chars!!
  expiration: 86400000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
