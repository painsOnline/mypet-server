server:
  port: 8080

spring:
  application:
    name: mypet-frontend
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

jwt:
  secret: mypet-jwt-secret-key-2026-minimum-32chars!!
  expiration: 86400000

wechat:
  app-id: ${WECHAT_APP_ID:}
  secret: ${WECHAT_SECRET:}
  work:
    webhook-key: ${WECHAT_WORK_WEBHOOK_KEY:73d0072b-5c75-4d1e-be5e-e2b20fb66f19}

# 上传文件路径（开发环境默认值）
mypet:
  upload:
    path: ${UPLOAD_PATH:F:/MyWorkspace/project/mypet/uploads}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
